name: Build Original Arman Website

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-original:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'BUILD ORIGINAL ARMAN')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build exact original React frontend
        id: build
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arman-build-log
          path: frontend/build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arman-original-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 1
