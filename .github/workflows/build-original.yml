name: Build Original Arman Website

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-original:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'BUILD ORIGINAL ARMAN')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build exact original React frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Replace Vercel static bundle with exact original build
        run: |
          cd ..
          rm -rf vercel-static
          mkdir -p vercel-static
          cp -a frontend/build/. vercel-static/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vercel-static
          if ! git diff --cached --quiet; then
            git commit -m "Restore exact original Arman React production build"
            git push origin main
          fi

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: arman-original-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 1
