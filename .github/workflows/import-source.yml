name: Import Arman Hair Studio Source

on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  import-source:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.event.issue.title, 'IMPORT ARMAN SOURCE')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/purshottamkhurana1993-arch/arman-hair-studio.git "$RUNNER_TEMP/arman-source"

      - name: Mirror source into target
        run: |
          cp .github/workflows/import-source.yml "$RUNNER_TEMP/import-source.yml"
          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/arman-source/" ./
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/import-source.yml" .github/workflows/import-source.yml

      - name: Commit imported website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import Arman Hair Studio website source"
          git push origin main
