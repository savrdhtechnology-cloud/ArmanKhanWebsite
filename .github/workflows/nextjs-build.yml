name: Next.js build check

# Builds the Next.js app (website + Partner Network) on every push that touches it,
# then opens every route in Chromium, so a broken build or page is caught before deploy.
on:
  push:
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-build.yml"
  pull_request:
    paths:
      - "nextjs/**"
  workflow_dispatch:

concurrency:
  group: nextjs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          npx tsc --noEmit --pretty false
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Smoke test (every route in Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          (npm start > server.log 2>&1 &)
          npx --yes wait-on@8.0.1 -t 60000 http://localhost:3000/network
          node scripts/smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: nextjs/smoke/
          retention-days: 7
