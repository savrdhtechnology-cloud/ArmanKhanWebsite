name: Build Vercel Static Bundle

# Rebuilds the React frontend and refreshes vercel-static/ (the folder Vercel serves)
# whenever frontend source changes on main.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-static
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build React frontend
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: ""
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Replace Vercel static bundle
        run: |
          cd ..
          rm -rf vercel-static
          mkdir -p vercel-static
          cp -a frontend/build/. vercel-static/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vercel-static
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Vercel static bundle from frontend source"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
